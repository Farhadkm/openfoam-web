# AWS dev: images from ECR. Replace __PUBLIC_HOST__ on the server (see deploy/aws/README.md).
# No OTel collector on EC2 — tracing disabled via OTEL_SDK_DISABLED.

x-otel-disabled: &otel-disabled
  OTEL_SDK_DISABLED: "true"
  LOG_HTTP_BODY_ENABLED: "false"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  forge-runner:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.runner.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *otel-disabled
      JOBS_ROOT: /jobs
      OPENFOAM_IMAGE: opencfd/openfoam-run:2512
      OPENFOAM_BASHRC: /usr/lib/openfoam/openfoam2512/etc/bashrc
      JOBS_VOLUME_NAME: forge-jobs-data
      JOBS_VOLUME_MOUNT: /work
    volumes:
      - jobs_data:/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"

  simulation:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.simulation.app:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    environment:
      <<: *otel-disabled
      RUNNER_URL: http://forge-runner:8080
      JOBS_ROOT: /jobs
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: forge_web
    volumes:
      - jobs_data:/jobs
    depends_on:
      mongo:
        condition: service_healthy
      forge-runner:
        condition: service_started

  pss:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.pss.app:app", "--host", "0.0.0.0", "--port", "8003"]
    expose:
      - "8003"
    environment:
      <<: *otel-disabled
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: forge_web
      SIMULATION_SERVICE_URL: http://simulation:8001
      PSS_MODELS_ROOT: /pss_models
    volumes:
      - pss_models:/pss_models
    depends_on:
      mongo:
        condition: service_healthy
      simulation:
        condition: service_started

  bff:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.bff.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      <<: *otel-disabled
      SIMULATION_SERVICE_URL: http://simulation:8001
      PSS_SERVICE_URL: http://pss:8003
      CCS_SERVICE_URL: http://ccs:8081
      TRAME_VIEWER_URL: http://trame-viewer:8090
      CORS_ORIGINS: http://__PUBLIC_HOST__:3000,http://localhost:3000
    depends_on:
      - simulation
      - pss
      - ccs
      - trame-viewer

  ccs:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.ccs.app:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    environment:
      <<: *otel-disabled
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-composite-dream-427518-b8}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/key.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      ICS_URL: http://ics:8082
    volumes:
      - ./backend/credentials/key.json:/app/credentials/key.json:ro
    depends_on:
      - ics

  ics:
    image: ${ECR_REGISTRY}/forge-web-dev-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "services.ics.app:app", "--host", "0.0.0.0", "--port", "8082"]
    expose:
      - "8082"
    environment:
      <<: *otel-disabled
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-composite-dream-427518-b8}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/key.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./backend/credentials/key.json:/app/credentials/key.json:ro

  trame-viewer:
    image: ${ECR_REGISTRY}/forge-web-dev-trame-viewer:latest
    restart: unless-stopped
    environment:
      JOBS_ROOT: /jobs
      TRAME_WS_MAX_MSG_SIZE: "134217728"
      WSLINK_HEART_BEAT: "120"
    volumes:
      - jobs_data:/jobs
    ports:
      - "8090:8090"
    entrypoint:
      ["python", "/deploy/app.py", "--host", "0.0.0.0", "--port", "8090", "--timeout", "0"]

  frontend:
    image: ${ECR_REGISTRY}/forge-web-dev-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://__PUBLIC_HOST__:8000
    depends_on:
      - bff
      - trame-viewer
      - ccs

volumes:
  jobs_data:
    name: forge-jobs-data
  pss_models:
  mongo_data:
